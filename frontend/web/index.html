<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta name="description" content="Bearfit" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />

    <title>Bearfit</title>

    <style>
      /* Remove default browser margins and ensure full-viewport rendering */
      html, body {
        height: 100%;
        background-color: #000000;
      }
      body {
        margin: 0;
        overscroll-behavior: none;
      }

      /* Ensure the Flutter surface fills the viewport (covers both HTML and CanvasKit backends) */
      flt-glass-pane, /* HTML backend (older/newer Flutter) */
      #flt-glass-pane, /* some versions use id */
      flutter-view,    /* newer embedding */
      canvas,          /* CanvasKit surface */
      #canvasKit {
        position: fixed !important;
        inset: 0 !important;  /* top:0; right:0; bottom:0; left:0 */
        width: 100vw !important;
        height: 100vh !important;
      }
    </style>
  </head>
  <body>
    <!-- Flutter injects its canvas/view here -->
    <script src="flutter.js" defer></script>
    <script>
      window.addEventListener('load', function () {
        if (window.flutterConfiguration === undefined) {
          window.flutterConfiguration = {};
        }
        _flutter.loader.loadEntrypoint({
          onEntrypointLoaded: function (engineInitializer) {
            engineInitializer.initializeEngine().then(function (appRunner) {
              appRunner.runApp();
            });
          },
        });
      });
    </script>
  </body>
</html>
